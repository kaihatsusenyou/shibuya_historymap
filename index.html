<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>東京歴史マップ</title>
  <meta name="description" content="東京の区の歴史スポットを時代ごとに地図で巡るWebアプリ">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="app-header">
    <div class="brand">
      <h1>東京歴史マップ</h1>
      <select id="ward" class="ward-select" aria-label="表示する区"></select>
    </div>
    <button id="toggle-panel" class="panel-toggle" aria-controls="panel" aria-expanded="true">一覧</button>
  </header>

  <main class="app">
    <aside id="panel" class="panel">
      <section class="panel-section">
        <input id="search" type="search" placeholder="スポット名・キーワードで検索" aria-label="検索">
      </section>

      <section class="panel-section">
        <h2>地域</h2>
        <select id="district" aria-label="地域で絞り込む">
          <option value="" id="district-all">全域</option>
        </select>
      </section>

      <section class="panel-section">
        <h2>時代</h2>
        <div id="era-filters" class="era-filters"></div>
        <label class="dark-toggle">
          <input id="show-dark" type="checkbox" checked>
          <span class="dark-mark" aria-hidden="true">!</span>
          事件・事故・災害など（負の歴史）も表示
        </label>
        <label class="dark-toggle">
          <input id="only-dark" type="checkbox">
          負の歴史だけを表示
        </label>
      </section>

      <section class="panel-section">
        <h2>年代 <span id="year-label" class="year-label"></span></h2>
        <input id="year-slider" type="range" aria-label="この年までのスポットを表示">
      </section>

      <section class="panel-section">
        <h2>昔の航空写真を重ねる</h2>
        <select id="old-photo" aria-label="重ねる航空写真">
          <option value="">なし</option>
          <option value="usa">1945〜1950年（終戦直後）</option>
          <option value="old10">1961〜1969年（東京五輪の頃）</option>
          <option value="gazo1">1974〜1978年</option>
        </select>
        <label class="opacity">
          透明度
          <input id="old-photo-opacity" type="range" min="0" max="100" value="70">
        </label>
      </section>

      <div class="tabs" role="tablist">
        <button type="button" role="tab" id="tab-spots" aria-selected="true" aria-controls="view-spots">スポット <span id="count" class="count"></span></button>
        <button type="button" role="tab" id="tab-timeline" aria-selected="false" aria-controls="view-timeline">年表</button>
      </div>

      <section id="view-spots" class="panel-section list-section" role="tabpanel" aria-labelledby="tab-spots">
        <ol id="spot-list" class="spot-list"></ol>
      </section>

      <section id="view-timeline" class="panel-section list-section" role="tabpanel" aria-labelledby="tab-timeline" hidden>
        <ol id="timeline" class="timeline"></ol>
      </section>

      <p class="note">年代・由来には諸説や伝承を含みます。各スポットの参考資料もあわせてご覧ください。</p>
    </aside>

    <div id="map" class="map" role="application" aria-label="歴史地図"></div>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
  <script src="data/common.js"></script>
  <script src="data/shibuya.js"></script>
  <script src="data/chiyoda.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
